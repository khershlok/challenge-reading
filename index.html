<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge Reading</title>
<meta name="description" content="A new set of articles every week to prepare for the General paper of The Challenge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2026-10-30a">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a href="#" class="brand">Challenge Reading</a>
    <nav>
      <a href="#">This week</a>
      <a href="#news">In the news</a>
      <a href="#archive">All weeks</a>
      <a href="#sources">Sources</a>
      <a href="#about">How to use</a>
    </nav>
    <button id="tutor-btn" class="tutor-btn" aria-controls="tutor-panel" aria-expanded="false">Ask Roque</button>
  </div>
</header>
<!-- The tutor sits outside #app so the conversation stays open while you move between pages. -->
<aside id="tutor-panel" class="tutor-panel" aria-label="Roque, the AI tutor" hidden>
  <div class="tutor-head">
    <span><strong>Roque</strong> <span class="source-inline">AI tutor</span></span>
    <button id="tutor-close" class="secondary" aria-label="Close Roque">Close</button>
  </div>
  <div id="tutor-body" class="tutor-body"></div>
</aside>
<main id="app" class="wrap"></main>
<footer class="site-footer">
  <div class="wrap">A new week arrives every Monday. Preparation for the General paper of The Challenge at Westminster School (first examination 2027).</div>
</footer>
<!-- One script per weekly lesson; a new one is added each Sunday. -->
<script src="content/weeks/week-01.js"></script>
<script src="content/now.js"></script>
<script src="content/news.js"></script>
<!-- Change the ?v= number whenever app.js or style.css changes, so browsers fetch the new file instead of an old saved copy. -->
<script src="app.js?v=2026-10-30a"></script>
</body>
</html>
